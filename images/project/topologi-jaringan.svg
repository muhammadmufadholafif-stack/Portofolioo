<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <!-- Glowing Lines -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Top Title Bar -->
  <rect x="20" y="20" width="760" height="40" rx="8" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(6, 182, 212, 0.3)" />
  <circle cx="45" cy="40" r="5" fill="#ef4444" />
  <circle cx="62" cy="40" r="5" fill="#eab308" />
  <circle cx="79" cy="40" r="5" fill="#10b981" />
  <text x="105" y="45" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13">MikroTik RouterOS 7.x // OSPF Routing &amp; VLAN 802.1Q Topology</text>
  <rect x="670" y="28" width="95" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
  <text x="686" y="44" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ACTIVE</text>

  <!-- Connection Lines (Network Cables) -->
  <!-- Internet to Router -->
  <path d="M 400 90 L 400 140" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4" filter="url(#glow)" />
  <!-- Router to Switch 1 -->
  <path d="M 360 200 L 220 280" stroke="url(#cyanGlow)" stroke-width="2.5" />
  <!-- Router to Switch 2 -->
  <path d="M 440 200 L 580 280" stroke="url(#cyanGlow)" stroke-width="2.5" />
  <!-- Switch 1 to VLANs -->
  <path d="M 220 330 L 140 400" stroke="#6366f1" stroke-width="2" />
  <path d="M 220 330 L 280 400" stroke="#06b6d4" stroke-width="2" />
  <!-- Switch 2 to Servers -->
  <path d="M 580 330 L 520 400" stroke="#10b981" stroke-width="2" />
  <path d="M 580 330 L 660 400" stroke="#eab308" stroke-width="2" />

  <!-- Node 0: WAN / Internet Cloud -->
  <g transform="translate(340, 75)">
    <rect width="120" height="36" rx="18" fill="rgba(30, 41, 59, 0.9)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="60" y="23" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WAN / ISP Gateway</text>
  </g>

  <!-- Node 1: Core Router MikroTik (Center) -->
  <g transform="translate(320, 140)">
    <rect width="160" height="70" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#6366f1" stroke-width="2" filter="url(#glow)" />
    <rect x="15" y="15" width="24" height="24" rx="4" fill="#6366f1" />
    <text x="27" y="32" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">R1</text>
    <text x="50" y="28" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">CCR2004 Core</text>
    <text x="50" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">OSPF Area 0.0.0.0</text>
    <circle cx="135" cy="55" r="4" fill="#10b981" />
    <text x="110" y="58" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">RUNNING</text>
  </g>

  <!-- Node 2: Distribution Switch 1 (Left) -->
  <g transform="translate(140, 275)">
    <rect width="160" height="60" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="15" y="25" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">CRS326 Switch A</text>
    <text x="15" y="42" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="10">802.1Q Trunk Port</text>
    <circle cx="140" cy="20" r="3" fill="#10b981" />
  </g>

  <!-- Node 3: Distribution Switch 2 (Right) -->
  <g transform="translate(500, 275)">
    <rect width="160" height="60" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="25" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">CRS326 Switch B</text>
    <text x="15" y="42" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Server Farm Trunk</text>
    <circle cx="140" cy="20" r="3" fill="#10b981" />
  </g>

  <!-- Leaf Nodes (VLAN 10, VLAN 20, Debian Server, Storage) -->
  <!-- VLAN 10 -->
  <g transform="translate(70, 395)">
    <rect width="120" height="50" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="#6366f1" stroke-width="1.2" />
    <text x="60" y="22" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">VLAN 10: LAB TKJ</text>
    <text x="60" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">192.168.10.0/24</text>
  </g>

  <!-- VLAN 20 -->
  <g transform="translate(210, 395)">
    <rect width="130" height="50" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="#06b6d4" stroke-width="1.2" />
    <text x="65" y="22" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">VLAN 20: GURU/STAF</text>
    <text x="65" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">192.168.20.0/24</text>
  </g>

  <!-- Debian Server -->
  <g transform="translate(460, 395)">
    <rect width="120" height="50" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="#10b981" stroke-width="1.2" />
    <text x="60" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Debian 12 Server</text>
    <text x="60" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">DNS / Web / DB</text>
  </g>

  <!-- Backup & Storage -->
  <g transform="translate(605, 395)">
    <rect width="120" height="50" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="#eab308" stroke-width="1.2" />
    <text x="60" y="22" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Proxmox VE</text>
    <text x="60" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Virtual Cluster</text>
  </g>
</svg>

